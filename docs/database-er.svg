<path class="edge" d="M340 167 H378 V199 H420"/>
<text x="350" y="158" class="small">1</text><text x="399" y="189" class="small">N</text>
<path class="edge" d="M800 167 H840 V231 H900"/>
<text x="810" y="158" class="small">1</text><text x="876" y="222" class="small">N</text>
<path class="edge" d="M30 167 H14 V660 H1320 V199 H1300"/>
<text x="30" y="650" class="small">1 meeting → N questions</text>
<text x="520" y="650" class="small">Attendee ownership uses composite (UserId, MeetingId) FK</text>
<text x="30" y="710" class="small">Organizer = the meeting’s single MeetingAttendees row where Role = Organizer (partial unique index).</text>
<text x="30" y="738" class="small">Unique lower-case meeting code index. One Speaking question per meeting. FIFO: SubmittedAt, QuestionId. Restrictive foreign-key deletion.</text>
<text x="30" y="766" class="small">SessionTokenHash is internal. WithdrawalTokenHash supports legacy questions. Migration history table omitted.</text>
<path class="edge" d="M408 191 L420 199 L408 207 M408 199 H420 M888 223 L900 231 L888 239 M888 231 H900"/>
